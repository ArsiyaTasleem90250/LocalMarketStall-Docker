
services:
  postgresdb:
    image: postgres:16-alpine
    container_name: stall-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: exam_2400090250
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stall-network

  eureka:
    build:
      context: ./backend/EurekaService
      dockerfile: Dockerfile
    container_name: stall-eureka
    ports:
      - "8761:8761"
    networks:
      - stall-network

  backend:
    image: arsiya90250/docker-backend-2400090250:latest
    container_name: stall-backend
    ports:
      - "8081:8081"
    depends_on:
      - postgresdb
      - eureka
    restart: on-failure
    networks:
      - stall-network

  frontend:
    image: arsiya90250/docker-frontend-2400090250:latest
    container_name: stall-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - stall-network

volumes:
  postgres_data:

networks:
  stall-network:
